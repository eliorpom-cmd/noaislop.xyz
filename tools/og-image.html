<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter";
    src: url("../public/fonts/inter-latin.woff2") format("woff2");
    font-weight: 400 800;
  }
  @font-face {
    font-family: "Rubik Wet Paint";
    src: url("../public/fonts/rubik-wet-paint-subset.woff2") format("woff2");
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #fffdf6;
    color: #15160e;
    font-family: "Inter", system-ui, sans-serif;
    padding: 62px 76px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .masthead {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 20px;
    border-bottom: 1px solid #d9d6c2;
  }
  .masthead span { font-size: 32px; line-height: 1; }
  .masthead p {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 27px; font-weight: 700; letter-spacing: -0.02em;
  }
  h1 { font-size: 118px; line-height: 0.93; letter-spacing: -0.05em; font-weight: 800; margin-top: 52px; }
  .sub { font-size: 38px; color: #4e5044; margin-top: 22px; }
  .rule { height: 4px; background: #15160e; }
  .stamp {
    position: absolute; right: 70px; bottom: 108px;
    transform: rotate(-8deg);
    font-family: "Rubik Wet Paint", cursive;
    font-size: 150px; line-height: 1; letter-spacing: 0.02em;
    color: #a8c520; -webkit-text-stroke: 5px #4c5b06;
  }
</style>
<body>
  <div>
    <div class="masthead">
      <span>🤮</span>
      <p>noaislop.xyz</p>
    </div>
    <h1>your AI slop sucks.</h1>
    <p class="sub">Someone sent you this link. There’s a reason.</p>
  </div>
  <div class="rule"></div>
  <div class="stamp">SLOP</div>
</body>
