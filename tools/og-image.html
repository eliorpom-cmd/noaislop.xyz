<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Heros";
    src: url("../public/fonts/heros-400-latin.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Heros";
    src: url("../public/fonts/heros-700-latin.woff2") format("woff2");
    font-weight: 700;
  }
  @font-face {
    font-family: "Comico";
    src: url("../public/fonts/comico-400-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Rubik Wet Paint";
    src: url("../public/fonts/rubik-wet-paint-subset.woff2") format("woff2");
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #fdfdfc;
    color: #101114;
    font-family: "Heros", Helvetica, sans-serif;
    padding: 58px 76px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .doc-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px dashed #cfcec9;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #63666d;
  }
  h1 {
    font-family: "Comico", sans-serif;
    font-size: 104px;
    line-height: 1.02;
    font-weight: 400;
    margin-top: 54px;
  }
  .sub { font-size: 30px; color: #63666d; margin-top: 26px; }
  .rule { height: 1px; background: #e2e1dc; }
  .stamp {
    position: absolute; right: 76px; bottom: 92px;
    transform: rotate(-6deg);
    font-family: "Rubik Wet Paint", cursive;
    font-size: 118px; line-height: 1; letter-spacing: 0.02em;
    color: #a8c520; -webkit-text-stroke: 4px #4c5b06;
  }
</style>
<body>
  <div>
    <div class="doc-meta">
      <span>🤮 noaislop.xyz</span>
      <span>Public domain</span>
    </div>
    <h1>your AI slop sucks.</h1>
    <p class="sub">Someone sent you this link. There’s a reason.</p>
  </div>
  <div class="rule"></div>
  <div class="stamp">SLOP</div>
</body>
